<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mr.Wafay - Printers</title>
    <link rel="stylesheet" href="Style.css">
</head>
<body>
    <nav class="navbar">
        <a href="index.html" class="logo">Mr.Wafay</a>
        <ul class="nav-links" id="navLinks">

    <section class="printers">
        <h2>مكينات الطباعة</h2>

            <button onclick="filterPrinters('all')">الكل</button>

            <button onclick="filterPrinters('pro')">إنتاج</button>
        </div>

        <div class="printers-container">
            <div class="printer-card bw">
                <h3>Ricoh MP 201</h3>
                <button onclick="addToCart('Ricoh MP 201')">اطلب الماكينة</button>
            </div>
            <div class="printer-card bw">
                <h3>Ricoh MP 2352</h3>
                <button onclick="addToCart('Ricoh MP 2352')">اطلب الماكينة</button>
            </div>
            <div class="printer-card bw">
                <h3>Ricoh MP 4054</h3>
                <button onclick="addToCart('Ricoh MP 4054')">اطلب الماكينة</button>
            </div>
            <div class="printer-card color">
                <h3>Ricoh MPC 3003</h3>
                <button onclick="addToCart('Ricoh MPC 3003')">اطلب الماكينة</button>
            </div>
            <div class="printer-card color">
                <h3>Ricoh MPC 4503</h3>
                <button onclick="addToCart('Ricoh MPC 4503')">اطلب الماكينة</button>
            </div>
            <div class="printer-card pro">
                <h3>Ricoh Pro 7100</h3>
                <button onclick="addToCart('Ricoh Pro 7100')">اطلب الماكينة</button>
            </div>
            <div class="printer-card pro">
                <h3>Ricoh Pro 9100</h3>
                <button onclick="addToCart('Ricoh Pro 9100')">اطلب الماكينة</button>
            </div>
        </div>
    </section>   

    <script type="module" src="script.js"></script>
